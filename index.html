<meta charset="utf-8">
<title>El Conejo Beta 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@500&display=swap">
<style>

/* Layout: one meadow column. Map trail -> lesson card -> a live storybook stage (sky with speech bubbles over a grass strip where characters and labeled places live), controls in a card underneath. Deliberately one sunny daytime look. */
:root{
  --field:#E3ECD1; --meadow:#CADDAE; --card:#FDFEF8; --ink:#25311F; --muted:#5C6A52;
  --leaf:#3D7A33; --leaf-soft:#DCEBCB; --carrot:#E2681C; --carrot-deep:#B04C12;
  --bad:#B8362A; --bad-soft:#F7DCD6; --good:#2E7A37; --good-soft:#D8EDD3; --line:#B7C79E; --star:#F2A81D;
  --sky-a:#BFE3F2; --sky-b:#EAF6E6; --grass:#A9D27F; --grass-deep:#8EBF63; --grass-edge:#79A852;
  --bark:#8A5A3B; --water:#6FB7D9; --stone:#ABB1A1; --coin:#F2C230; --pine:#2F6B3A; --hill:#B9D99A; --hill-far:#CFE6B6; --sun:#FFD45C;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:light;
}
html,body{min-height:100%}
html,body,input,button{color-scheme:light}
body{background:var(--field);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse 120% 40% at 50% 105%,var(--meadow) 0 60%,transparent 61%);background-attachment:fixed}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--carrot);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.btn{font-family:var(--display);font-weight:600;font-size:17px;border:2px solid var(--ink);border-radius:14px;padding:11px 20px;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--carrot);color:#fff}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.small{font-size:14px;padding:6px 12px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
.link{background:none;border:0;padding:4px 2px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px}
kbd{font-family:var(--mono);font-size:12px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:0 5px;background:var(--card);color:var(--muted)}

/* title */
.title-screen{align-items:center;text-align:center;padding-top:40px;gap:22px}
.title-screen h1{font-size:clamp(52px,14vw,96px);font-weight:700;letter-spacing:-.01em}
.title-screen h1 span,.brand span{color:var(--carrot)}
.hero-art{width:min(240px,60vw);display:flex;align-items:flex-end;justify-content:center;gap:4px}
.hero-art .bunny{width:62%}
.hero-art .carrot{width:26%;transform:rotate(18deg)}
.lang-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%;max-width:520px}
.lang-card{text-align:left;border:2px solid var(--ink);border-radius:18px;background:var(--card);padding:16px 18px;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:2px}
.lang-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.lang-card b{font-family:var(--display);font-size:22px;font-weight:600}
.lang-card small{color:var(--muted);font-size:14px}

/* map */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:26px}
.trail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;position:relative}
.trail::before{content:"";position:absolute;left:27px;top:20px;bottom:20px;border-left:4px dashed var(--line)}
.stop{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 14px 12px 8px;box-shadow:0 4px 0 var(--ink)}
.stop:disabled{background:#EEF2E6;border-color:var(--line);box-shadow:0 4px 0 var(--line);cursor:default;color:var(--muted)}
.badge{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;border:2px solid var(--ink);background:var(--card)}
.stop.done .badge{background:var(--leaf);color:#fff}
.stop.current .badge{background:var(--carrot);color:#fff}
.stop:disabled .badge{border-color:var(--line);background:#E4EAD8}
.stop-text{flex:1;min-width:0;display:flex;flex-direction:column}
.stop-text b{font-family:var(--display);font-weight:600;font-size:19px}
.stop-text small{color:var(--muted);font-size:14px}
.chip{display:inline-block;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor}
.chip.easy{color:var(--good)}.chip.medium{color:#A36A06}.chip.hard{color:var(--bad)}
.stars{display:inline-flex;gap:2px;flex:none}
.stars svg{width:20px;height:20px}
.goal{display:flex;align-items:center;gap:14px;padding-left:4px;font-family:var(--display);font-weight:600;color:var(--carrot-deep)}
.goal .carrot{width:44px}
.save-note{font-size:13px;color:var(--muted)}
.confirm{border:2px solid var(--bad);background:var(--bad-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

/* panels */
.panel{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 0 var(--ink)}
.intro-head{display:flex;gap:16px;align-items:center}
.npc-big{font-size:58px;line-height:1;flex:none}
.intro-head h2{font-size:30px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fact{background:var(--field);border-radius:12px;padding:10px 12px}
.fact small{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:600}

/* lesson */
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.word{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:10px 12px;min-width:0}
.word div{flex:1;min-width:0}
.word b{font-family:var(--display);font-weight:600;font-size:19px;display:block}
.word span{color:var(--muted);font-size:14px}
.speak{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);display:grid;place-items:center;padding:0}
.speak svg{width:16px;height:16px}
.progress{height:12px;border-radius:99px;background:var(--field);border:2px solid var(--ink);overflow:hidden}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.q-prompt{font-family:var(--display);font-weight:600;font-size:clamp(26px,7vw,36px);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);padding:12px 14px;text-align:left;font-size:17px;box-shadow:0 3px 0 var(--ink);display:flex;gap:10px;align-items:baseline}
.choice .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.choice:disabled{cursor:default}
.choice.right{background:var(--good-soft);border-color:var(--good);box-shadow:0 3px 0 var(--good)}
.choice.wrongpick{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);color:var(--bad)}
.typebox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
.typebox input{width:100%;min-width:0;font:inherit;font-size:19px;border:2px solid var(--ink);border-radius:14px;padding:11px 14px;background:var(--card);color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--carrot);opacity:1}
.typebox input::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted)}
.typebox input:disabled{background:var(--field)}
.typebox input:focus-visible{outline-offset:0}
#qbody{display:flex;flex-direction:column;gap:12px}
.accents{display:flex;gap:5px;flex-wrap:nowrap;padding-top:2px}
.accents button{flex:1 1 0;min-width:0;max-width:40px;height:34px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1;padding:0}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;animation:fbin .25s ease-out}
@keyframes fbin{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb b{font-family:var(--display);font-weight:600;font-size:18px}
.fb .ans{color:var(--ink)}
.fb .row{margin-top:2px}
.keyhint{font-size:13px;color:var(--muted)}

/* play HUD */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:600}
.hud .lvl{font-size:18px}
.hearts{color:var(--bad);font-size:20px;letter-spacing:1px}
.hearts .gone{color:var(--line)}
.hearts .lost{display:inline-block;animation:heartpop .6s}
@keyframes heartpop{0%{transform:scale(1.6)}100%{transform:none}}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:15px}
.trcount{font-size:14px;color:var(--muted);font-weight:500}
.quit{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);font-size:18px;line-height:1;padding:0}
.track{position:relative;height:30px}
.track .path{position:absolute;left:12px;right:30px;top:14px;border-top:3px dashed var(--line)}
.track .dot{position:absolute;top:9px;width:13px;height:13px;border-radius:50%;background:var(--card);border:2.5px solid var(--line);transform:translateX(-50%);left:calc(12px + (100% - 42px) * var(--p))}
.track .dot.passed{background:var(--leaf);border-color:var(--leaf)}
.track .mini-carrot{position:absolute;right:4px;top:0;width:18px;transform:rotate(14deg)}

/* the play screen fits in one view */
.play-wrap{padding-block:10px 14px;gap:8px}
.play-wrap .hud{gap:8px}
.play-wrap .quit{width:32px;height:32px;font-size:16px}
.play-wrap .track{height:18px}
.play-wrap .track .path{top:8px}.play-wrap .track .dot{top:3px;width:12px;height:12px}.play-wrap .track .mini-carrot{top:-2px;width:15px}
.controls{padding:12px 14px;gap:10px;border-radius:18px}
.controls .opts{gap:8px}
.controls .choice{padding:9px 12px;font-size:16px}
.controls .typebox input{padding:9px 12px;font-size:18px}
.controls .btn{padding:9px 16px}
.yours{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--field);border-radius:12px;padding:10px 12px}
.yl{flex:none;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.yt{font-family:var(--display);font-weight:600;font-size:18px;min-width:0}
@media (max-width:460px){.vocab{grid-template-columns:1fr 1fr;gap:8px}.word{padding:8px 10px}.word b{font-size:16px}.word span{font-size:13px}.word .speak{width:30px;height:30px}}

/* ---------- the stage: a window onto one wide world that the camera pans across ---------- */
.stage{position:relative;flex:none;height:clamp(200px,min(72vw,calc(100dvh - 390px)),420px);border:2px solid var(--ink);border-radius:22px;overflow:hidden;background:#BFE3F2;box-shadow:0 6px 0 var(--ink)}
.world{position:absolute;left:0;top:0;will-change:transform;transform-origin:0 0}
.world svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wui{position:absolute;inset:0;pointer-events:none}
.talk{position:absolute;inset:0;z-index:4;pointer-events:none}
.bub{position:absolute;left:0;top:0;width:max-content;max-width:min(250px,calc(100% - 16px));pointer-events:auto;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:7px 11px;font-family:var(--display);font-weight:500;font-size:clamp(15px,3.9vw,18px);line-height:1.38;animation:bubin .3s cubic-bezier(.3,1.5,.6,1);transform-origin:var(--tail,50%) 100%;box-shadow:0 3px 0 rgba(37,49,31,.18)}
.bub::after{content:"";position:absolute;bottom:-9px;left:calc(var(--tail,30px) - 8px);width:14px;height:14px;background:inherit;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.bub-b{background:#FFF6EC}
.bub-n.confused{border-style:dashed}
@keyframes bubin{from{transform:scale(.6) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.who{display:block;font-family:var(--display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.line{display:flex;flex-wrap:wrap;gap:0 6px;align-items:flex-start}
.chunk{display:inline-flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;font:inherit;color:var(--ink);text-align:left}
.chunk.tap{border-bottom:2px dotted var(--line)}
.chunk.tap:hover{border-bottom-color:var(--carrot)}
.gloss{font-family:var(--body);font-style:italic;font-size:13px;color:var(--leaf);line-height:1.2;padding-bottom:2px}
.bub .speak{width:28px;height:28px;float:right;margin:0 0 4px 6px}

/* the carrot prize: rises over the bunny's head, wobbles, then pops */
.pz-c{transform-box:fill-box;transform-origin:50% 50%;animation:prize 2.3s cubic-bezier(.3,.9,.4,1) forwards}
@keyframes prize{0%{transform:translate(0,0) scale(.7)}30%{transform:translate(var(--dx),var(--dy)) scale(1.55) rotate(-14deg)}42%{transform:translate(var(--dx),calc(var(--dy) + 7px)) scale(1.65,1.45) rotate(10deg)}54%{transform:translate(var(--dx),var(--dy)) scale(1.6) rotate(-7deg)}66%{transform:translate(var(--dx),calc(var(--dy) - 3px)) scale(1.65) rotate(4deg)}78%{transform:translate(var(--dx),var(--dy)) scale(1.95) rotate(0);opacity:1}84%,100%{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}}
.pz-b{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:burst 2.3s ease-out forwards}
@keyframes burst{0%,79%{transform:translate(var(--dx),var(--dy)) scale(.1);opacity:0}84%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.5);opacity:0}}
.pz-t{opacity:0;animation:poptxt 2.3s ease-out forwards}
@keyframes poptxt{0%,80%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}88%{opacity:1;transform:translate(var(--dx),calc(var(--dy) - 6px)) scale(1.15)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) - 18px)) scale(1)}}

/* choice signs: little wooden boards planted in the ground at the spot they name */
.place{position:absolute;transform:translate(-50%,calc(-100% - 13px));pointer-events:auto;font-family:var(--display);font-weight:600;font-size:12px;line-height:1.15;color:#3A2A1C;
  background:repeating-linear-gradient(0deg,rgba(138,90,59,.10) 0 2px,transparent 2px 7px),#EED3A1;border:2px solid #5A3A2A;border-radius:5px;padding:4px 8px;box-shadow:0 2px 0 #5A3A2A;max-width:88px;width:max-content;text-align:center;animation:placein .4s cubic-bezier(.3,1.5,.6,1) backwards;transition:opacity .25s}
.place::after{content:"";position:absolute;left:50%;top:100%;margin-left:-3px;width:6px;height:13px;background:#8A5A3B;border:1.5px solid #5A3A2A;border-top:0}
.place.tag{transform:translate(-50%,0);border-radius:4px;padding:2px 6px;font-size:11.5px}
.place.tag::after{display:none}
.place:hover:not(:disabled){background:#F6E2B9}
.place.right{background:#CFE8C5;border-color:#2E7A37;box-shadow:0 2px 0 #2E7A37}
.place.wrong{background:#F2D2CB;border-color:#B8362A;color:#8E2A20;box-shadow:0 2px 0 #B8362A}
.place.dim{opacity:.45}
.place:disabled{cursor:default}
@keyframes placein{from{opacity:0}}
@media (max-width:460px){.place{font-size:11px;padding:3px 6px;max-width:80px}}

/* svg scenery behaviour */
.hot{cursor:pointer}
.hot:hover{filter:brightness(1.08) drop-shadow(0 0 3px #fff)}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(40px)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(5deg)}}
.ripple{animation:ripple 2.4s ease-in-out infinite}
@keyframes ripple{50%{transform:translateX(5px)}}
.crt{transition:transform .7s cubic-bezier(.3,1.4,.6,1)}
.crt.pulled{transform:translateY(-24px)}
.crops .crt{opacity:0;transform:translateY(10px) scale(.3);transform-box:fill-box;transform-origin:50% 100%;transition:transform .55s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.crops.up .crt{opacity:1;transform:none}
.crops.up .crt.pulled{transform:translateY(-24px);transition-delay:0s}
.pile{opacity:0;transition:transform .9s ease-in-out,opacity .5s}
.pile.out{opacity:1;transform:translate(36px,14px)}
.reveal{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.reveal.shown{opacity:1;transform:none}
.iris{position:absolute;z-index:6;left:0;top:0;width:calc(var(--r,0px)*2);height:calc(var(--r,0px)*2);transform:translate(-50%,-50%);border-radius:50%;box-shadow:0 0 0 3000px #16301D;pointer-events:none}
.moved{transition:transform .9s ease-in-out}
.plank{transition:transform .7s ease-in}
.plank.drop{transform:translate(4px,46px) rotate(50deg)}
.coins{transition:transform .5s cubic-bezier(.3,1.5,.6,1),opacity .4s;transform:translateY(16px);opacity:0}
.coins.shown{transform:none;opacity:1}
.rain line{animation:rain .9s linear infinite}
@keyframes rain{from{transform:translateY(-6px);opacity:0}50%{opacity:1}to{transform:translateY(10px);opacity:0}}

/* characters */
.ent .react,.ent .bob,.ent .leg-b,.ent .leg-f,.ent .ears,.ent .eye-o{transform-box:fill-box}
.ent .react{transform-origin:50% 100%}
.ent .bob{transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.03)}}
.ent.walking .bob{animation:hopwalk .4s ease-in-out infinite}
.cshadow{transform-box:fill-box;transform-origin:50% 50%}
.ent.walking .cshadow{animation:shadowhop .4s ease-in-out infinite}
@keyframes shadowhop{50%{transform:scaleX(.75);opacity:.1}}
@keyframes hopwalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.ent .leg-b{transform-origin:60% 20%}
.ent .leg-f{transform-origin:50% 10%}
.ent.walking .leg-b{animation:kick .4s ease-in-out infinite}
.ent.walking .leg-f{animation:reach .4s ease-in-out infinite}
@keyframes kick{50%{transform:rotate(-28deg)}}
@keyframes reach{50%{transform:rotate(32deg)}}
.ent .ears{transform-origin:40% 100%;animation:twitch 6s infinite}
@keyframes twitch{0%,88%,100%{transform:none}91%{transform:rotate(-10deg)}94%{transform:rotate(4deg)}}
.ent .eye-o{transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.eye-h,.sweat{display:none}
.ent.is-happy .eye-o{display:none}.ent.is-happy .eye-h{display:inline}
.ent.is-sad .sweat{display:inline}
.ent.fly .bob{animation:flap .5s ease-in-out infinite}
@keyframes flap{50%{transform:translateY(-6px) rotate(-6deg)}}
.react.happy{animation:jump .45s ease-out 2}
@keyframes jump{40%{transform:translateY(-16px)}100%{transform:none}}
.react.big{animation:bigjump .7s ease-out}
@keyframes bigjump{45%{transform:translateY(-34px)}70%{transform:translate(-8px,-6px)}100%{transform:none}}
.react.confused{animation:tilt 1.3s ease-in-out}
@keyframes tilt{15%{transform:rotate(-14deg)}35%{transform:rotate(12deg)}55%{transform:rotate(-10deg)}75%{transform:rotate(6deg)}100%{transform:none}}
.react.shake{animation:shake .45s 2}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.react.sit{animation:sit 1.4s ease-in-out}

/* ---- answer checking ---- */
const CONTR=[[/\bi'm\b/g,'i am'],[/\bim\b/g,'i am'],[/\bit's\b/g,'it is'],[/\bits\b/g,'it is'],[/\bwhat's\b/g,'what is'],[/\bwhats\b/g,'what is'],[/\bdon't\b/g,'do not'],[/\bi'd\b/g,'i would'],[/\byou're\b/g,'you are'],[/\bthey're\b/g,'they are'],[/\bwanna\b/g,'want to']];
function norm(s,keepAccents){
  s=String(s).toLowerCase().replace(/[’‘`´]/g,"'");
  CONTR.forEach(([r,v])=>{s=s.replace(r,v);});
  if(!keepAccents)s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return s.replace(/[¿?¡!.,;:"'()]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  if(Math.abs(a.length-b.length)>3)return 99;
  let p=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}
  return p[b.length];
}
// words whose small spelling differences change the grammar (ser/estar, person, tense…): never "close enough"
const GRAM=new Set('soy eres es somos son estoy estas esta estamos estan estoy fue era tengo tienes tiene tenemos tienen llamo llamas llama quiero quieres quiere puedo puedes puede voy vas va como comes come am is are was were have has do does go goes'.split(' '));
function typoOk(a,b){
  const A=a.split(' '),B=b.split(' ');if(A.length!==B.length)return false;
  let diff=0;
  for(let i=0;i<A.length;i++){
    const x=A[i],y=B[i];if(x===y)continue;
    if(x.length<5||GRAM.has(x)||GRAM.has(y)||lev(x,y)>1||x[0]!==y[0]||x.slice(-2)!==y.slice(-2))return false;
    diff++;
  }
  return diff>0&&diff<=2;
}
const SER=new Set('ser soy eres es somos son fue era'.split(' ')), ESTAR=new Set('estar estoy estas esta estamos estan'.split(' ')), BE=new Set('am is are was were be'.split(' '));
// line the answer up word by word with the closest accepted answer, and explain the first thing that differs
function align(u,c){
  const m=u.length,n=c.length,d=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i?j?0:i:j));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(u[i-1]===c[j-1]?0:1));
  const ops=[];let i=m,j=n;
  while(i||j){
    if(i&&j&&d[i][j]===d[i-1][j-1]+(u[i-1]===c[j-1]?0:1)){ops.unshift([u[i-1]===c[j-1]?'eq':'sub',u[i-1],c[j-1]]);i--;j--;}
    else if(i&&d[i][j]===d[i-1][j]+1){ops.unshift(['del',u[i-1]]);i--;}
    else{ops.unshift(['ins',null,c[j-1]]);j--;}
  }
  return ops;
}
function hintFor(input,accepted){
  const u=norm(input).split(' ').filter(Boolean);
  let best=null;
  for(const a of accepted){const ops=align(u,norm(a).split(' '));const cost=ops.filter(o=>o[0]!=='eq').length;if(!best||cost<best.cost)best={ops,cost};}
  const k=best.ops.findIndex(o=>o[0]!=='eq');if(k<0)return '';
  const [op,uw,cw]=best.ops[k];
  let prev=null;for(let i=k-1;i>=0;i--){if(best.ops[i][1]){prev=best.ops[i][1];break;}}
  const f=(key,o)=>t(key).replace(/\{(\w)\}/g,(_,x)=>esc(o[x]||''));
  if(op==='del')return f('hExtra',{w:uw});
  if(op==='ins')return f(prev?'hMissingAfter':'hMissingStart',{p:prev,c:cw[0]});
  if(tgt()==='es'&&SER.has(uw)&&ESTAR.has(cw))return f('hSerEstar',{w:uw});
  if(tgt()==='es'&&ESTAR.has(uw)&&SER.has(cw))return f('hEstarSer',{w:uw});
  if(tgt()==='en'&&BE.has(uw)&&BE.has(cw))return f('hBe',{w:uw});
  if((GRAM.has(uw)||GRAM.has(cw))&&uw.length>2&&cw.length>2&&uw.slice(0,2)===cw.slice(0,2))return f('hEnding',{w:uw});
  if(lev(uw,cw)<=2)return f('hSpell',{w:uw});
  return f('hWrong',{w:uw,c:cw[0]});
}
/* returns {ok, kind:'exact'|'accent'|'typo'|'alt', canon} — accepted[0] is the model answer shown back to the player */
function grade(input,accepted){
  const canon=accepted[0], v=norm(input), vA=norm(input,true);
  if(!v)return {ok:false,canon};
  if(norm(canon,true)===vA)return {ok:true,kind:'exact',canon};
  if(norm(canon)===v)return {ok:true,kind:'accent',canon};
  if(accepted.slice(1).some(a=>norm(a)===v))return {ok:true,kind:'alt',canon};
  if(typoOk(norm(canon),v))return {ok:true,kind:'typo',canon};
  if(accepted.slice(1).some(a=>typoOk(norm(a),v)))return {ok:true,kind:'alt',canon};
  return {ok:false,canon};
}
function gradeNote(g){
  if(g.kind==='accent')return `${t('accentNote')} <b>${esc(g.canon)}</b>`;
  if(g.kind==='typo')return `${t('typoNote')} <b>${esc(g.canon)}</b>`;
  if(g.kind==='alt')return `${t('altNote')} <b>${esc(g.canon)}</b>`;
  return '';
}

/* ============ WORD MEMORY (spaced review) ============
   Every lesson item is tracked per learner. A right answer moves it up a box, a miss sends it back to box 0.
   Box n comes back after GAPS[n] days, so practice lands just before a word is forgotten. */
const GAPS=[0,1,3,7,14,30,60];
const wkey=it=>norm(it[tgt()]);
function wordRec(it,lv){
  const W=me().words, k=wkey(it);
  if(!W[k])W[k]={es:it.es,en:it.en,alt:it.alt||null,lv,box:0,due:today(),seen:0,right:0,wrong:0};
  return W[k];
}
function wordResult(it,lv,ok){
  const r=wordRec(it,lv);r.seen++;
  if(ok){r.right++;r.box=Math.min(GAPS.length-1,r.box+1);}else{r.wrong++;r.box=0;}
  r.due=new Date((dayNum(today())+GAPS[r.box])*864e5).toISOString().slice(0,10);
  persist();
}
function weaken(it,lv){const r=wordRec(it,lv);r.box=0;r.due=today();persist();}
const dueWords=()=>Object.values(me().words).filter(r=>r.seen>0&&dayNum(r.due)<=dayNum(today())).sort((a,b)=>a.box-b.box||dayNum(a.due)-dayNum(b.due));
const weakWords=()=>Object.values(me().words).filter(r=>r.seen>0).sort((a,b)=>(a.right-a.wrong)-(b.right-b.wrong)||a.box-b.box);
function streakTouch(){
  const s=me().streak, d=dayNum(today());
  if(s.last===today())return;
  const gap=s.last?d-dayNum(s.last):99;
  const week=Math.floor(d/7);
  if(gap===1)s.n++;
  else if(gap===2&&s.freeze!==week){s.n++;s.freeze=week;}
  else s.n=1;
  s.last=today();persist();
}
const streakNow=()=>{const s=me().streak;if(!s.last)return 0;const gap=dayNum(today())-dayNum(s.last);return gap<=1||(gap===2&&s.freeze!==Math.floor(dayNum(today())/7))?s.n:0;};

let actx=null;
function sfx(kind){
  if(!save.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const now=actx.currentTime, g=actx.createGain();g.connect(actx.destination);
    const tone=(f1,f2,dur,type='sine',vol=.12,delay=0)=>{const o=actx.createOscillator(),gg=actx.createGain();o.type=type;o.frequency.setValueAtTime(f1,now+delay);o.frequency.exponentialRampToValueAtTime(f2,now+delay+dur);gg.gain.setValueAtTime(0.0001,now+delay);gg.gain.exponentialRampToValueAtTime(vol,now+delay+.015);gg.gain.exponentialRampToValueAtTime(0.0001,now+delay+dur);o.connect(gg);gg.connect(g);o.start(now+delay);o.stop(now+delay+dur+.02);};
    if(kind==='hop')tone(320,520,.09,'sine',.05);
    else if(kind==='ok'){tone(660,660,.12,'triangle',.1);tone(880,880,.16,'triangle',.1,.1);}
    else if(kind==='bad')tone(300,200,.25,'triangle',.08);
    else if(kind==='coin'){tone(988,988,.07,'square',.04);tone(1319,1319,.18,'square',.04,.07);}
    else if(kind==='pop'){tone(200,900,.12,'sine',.14);tone(1200,1600,.08,'triangle',.06,.1);}
    else if(kind==='splash'){const b=actx.createBuffer(1,actx.sampleRate*.35,actx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=actx.createBufferSource(),f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=1200;s.buffer=b;s.connect(f);f.connect(g);g.gain.value=.25;s.start();}
    else if(kind==='click')tone(800,600,.04,'square',.03);
    else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,f,.18,'triangle',.09,i*.11));}
  }catch(e){}
}

/* ============ SCENES ============
   A level's scene is data: presets for sky, ground and backdrop, then a list of props.
   Each prop is [name, ...arguments]; an argument written as {"es":…,"en":…} is shown in the language being learned. */
const SKIES={day:['#B9E0F2','#EAF6E6'],warm:['#FCE0C0','#FBF2DF'],forest:['#BCD8CB','#E1EEDC'],cool:['#C6D3E5','#EEF2E4'],evening:['#F4C7A6','#EEDDE6'],rain:['#A9B8C6','#D7DFE3'],city:['#BFDDF0','#EEF1EC']};
const GROUNDS={grass:['#A9D27F','#86B95C'],meadow:['#B5CF83','#9DBB69'],forest:['#93C273','#74A957'],town:['#D9CDB4','#C9BB9C'],city:['#B9C3A6','#9FAE8A']};
const lang=v=>v&&typeof v==='object'&&!Array.isArray(v)&&('es' in v)?v[tgt()]:v;
function buildScene(L,npcG,bunG){
  const sc=L.scene, W=sc.w, k='s'+L.id;
  ZN=[];
  const [a,b]=SKIES[sc.sky]||SKIES.day, [g1,g2]=GROUNDS[sc.ground||'grass'];
  let s='';
  if(sc.sky==='indoor'){s+=G.room(W);}
  else{
    s+=G.sky(k,a,b,g1,g2)+G.base(k,W);
    if(sc.sky!=='rain')s+=G.sun(sc.sun||Math.round(W*.12),58);
    const nc=Math.max(2,Math.round(W/380));for(let i=0;i<nc;i++)s+=sc.sky==='rain'?G.cloudDark(60+i*W/nc,24+(i%2)*18):G.cloud(140+i*W/nc,32+(i%2)*28,.8+(i%3)*.15);
    const bd=sc.back||'hills';
    if(bd==='hills')s+=G.hills(W,168,14,'#D3E8BB',260)+Array.from({length:Math.round(W/260)},(_,i)=>G.smalltree(60+i*260+((i*97)%80),174,.85)).join('');
    if(bd==='town')s+=G.hills(W,170,10,'#E3DCC0',260)+G.townBack(W);
    if(bd==='pines')s+=G.pinesBack(W);
    if(bd==='mountains')s+=G.mountains(W)+G.hills(W,172,10,'#C9DDB2',240);
    if(bd==='city')s+=G.skyline(W);
    s+=G.ground(k,W);
    if(sc.sky==='rain')s+=G.rainfall(W);
  }
  for(const it of sc.items)s+=prop(it,npcG);
  // characters never stand on flowers or grass tufts
  const spots=[sc.start,...L.nodes.flatMap(n=>[n.b,n.n,n.from].filter(Boolean)),...sc.finale.walk];
  const n0=ZN.length;
  spots.forEach(([x,y])=>Z.rect(x-34,y-90,68,94));
  for(let i=n0;i<ZN.length;i++)ZN[i]=ZN[i].replace('<rect ','<rect data-spot="1" ');
  s=s.includes('%NPC%')?s.replace('%NPC%',npcG)+bunG:s+npcG+bunG;
  return s+`<g class="ng" opacity="0" fill="#000">${ZN.join('')}</g>`;
}
function prop(it,npcG){
  const [name,...args0]=it, args=args0.map(lang);
  if(name==='npc')return '%NPC%';
  if(name==='g')return `<g id="${args[0]}"${args[2]?` class="${args[2]}"`:''}>${args0[1].map(x=>prop(x,npcG)).join('')}</g>`;
  if(name==='zone'){Z.rect(...args);return '';}
  if(name==='tint')return `<rect x="${args[0]}" y="0" width="${args[1]}" height="300" fill="${args[2]||'#1F4A2A'}" opacity="${args[3]||.18}"/>`;
  if(name==='raw')return args[0];
  if(!G[name]){console.warn('unknown prop',name);return '';}
  return G[name](...args);
}

/* ============ PLAY ============ */
let play=null;
const BUNNY_SPEED=150;
function nodeOpts(n){
  if(!n.opts)return [];
  if(n.t==='listen')return n.opts.map(o=>({...o,text:o[nat()],fb:o.fb&&o.fb[nat()]}));
  if(Array.isArray(n.opts)){
    return n.t==='act'
      ? n.opts.map(o=>({...o,text:o[nat()],fb:o.fb&&o.fb[nat()],lab:o.lab[nat()]}))
      : n.opts.map(o=>({text:o[tgt()],gloss:o[nat()],ok:!!o.ok,fb:o.fb&&o.fb[nat()]}));
  }
  return n.opts[tgt()].map(o=>({text:o.t,gloss:'',ok:!!o.ok,fb:o.fb}));
}
const words=s=>s.trim().split(/\s+/).length;
function parTime(l){
  let s=0;
  l.nodes.forEach(n=>{
    s+=6+0.5*words(parseLine(n.line).map(c=>c[tgt()]).join(' '));
    if(n.t==='type')s+=14;
    else s+=0.35*nodeOpts(n).reduce((a,o)=>a+words(o.text),0);

function wait(ms){const id=screenId;return new Promise(r=>setTimeout(()=>{if(id===screenId)r();},ms));}

/* --- characters --- */
function makeEnt(el){return {el,x:0,y:0};}
function place(E,x,y){E.x=x;E.y=y;E.el.style.transition='none';E.el.style.transform=`translate(${x}px,${y}px)`;}
function faceTo(E,dir){const f=E.el.querySelector('.flip');if(!f||!dir)return;const base=E.base===undefined?1:E.base;if(!base)return;f.style.transform=dir!==base?'scaleX(-1)':'';}
// whoever stands nearer the viewer is drawn on top (the market hedgehog stays behind the counter)
function depth(){
  if(play.l.scene.fixedDepth)return;
  const svg=$('#world svg'), want=[play.B,play.N].sort((a,b)=>a.zy-b.zy).map(e=>e.el);
  const kids=[...svg.children].filter(c=>c.classList.contains('ent'));
  if(kids[0]===want[0]&&kids[1]===want[1])return;
  want.forEach(el=>svg.appendChild(el));
  want.forEach(el=>getComputedStyle(el).transform);   // commit the start position so the walk animates from it
}
function routeTime(E,pts,speed){let x=E.x,y=E.y,d=0;for(const [px,py] of pts){d+=Math.hypot(px-x,py-y);x=px;y=py;}return d/speed*1000;}
async function walk(E,pts,speed,turn=true){
  for(const [px,py] of pts){
    const d=Math.hypot(px-E.x,py-E.y);if(d<1)continue;
    const ms=d/speed*1000;
    if(turn&&Math.abs(px-E.x)>2)faceTo(E,px>E.x?1:-1);
    getComputedStyle(E.el).transform;   // make sure the move starts from where the character really is
    if(play&&E===play.B)sfx('hop');
    E.el.classList.add('walking');
    E.el.style.transition=`transform ${ms}ms linear, opacity .6s`;
    E.el.style.transform=`translate(${px}px,${py}px)`;
    E.x=px;E.y=py;
    await wait(ms);
  }

}

/* --- camera: pans, and zooms for walking into new places --- */
function layout(){
  if(!play)return;
  const st=$('#stage');if(!st)return;
  const H=st.clientHeight, s=H/300, w=$('#world');
  play.scale=s;play.vw=st.clientWidth;play.vh=H;
  w.style.width=play.l.scene.w*s+'px';w.style.height=H+'px';
  camTo(play.camX,0,play.z||1,play.camY||150);
}
function camTo(x,ms,z=1,y=150){
  play.camX=x;play.camY=y;play.z=z;const w=$('#world');if(!w)return;
  const s=play.scale, W=play.l.scene.w*s*z, H=300*s*z;
  let tx=play.vw/2-x*s*z;tx=Math.min(0,Math.max(play.vw-W,tx));
  let ty=play.vh/2-y*s*z;ty=Math.min(0,Math.max(play.vh-H,ty));
  play.tx=tx;play.ty=ty;
  w.style.transition=ms?`transform ${ms}ms ease-in-out`:'none';
  w.style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
}
function fitCam(x,reg){
  if(!reg)return {x,z:1,y:150};
  const vis=play.vw/play.scale, z=Math.max(1,vis/(reg[1]-reg[0])), half=vis/z/2;
  return {x:Math.max(reg[0]+half,Math.min(reg[1]-half,x)),z,y:300-150/z};
}
const toScreen=(x,y)=>[play.tx+x*play.scale*play.z, play.ty+y*play.scale*play.z];
async function iris(open,x,y,ms=550){
  const ir=$('#iris'), [sx,sy]=toScreen(x,y), big=Math.hypot(play.vw,play.vh)*1.1;
  ir.style.left=sx+'px';ir.style.top=sy+'px';
  ir.style.transition='none';ir.style.setProperty('--r',(open?0:big)+'px');void ir.offsetWidth;
  ir.style.transition=`width ${ms}ms ease-in-out,height ${ms}ms ease-in-out`;ir.style.setProperty('--r',(open?big:0)+'px');
  ir.hidden=false;
  await wait(ms);
  if(open)ir.hidden=true;
}
window.addEventListener('resize',()=>{if(play&&$('#world')){layout();placeBubbles();}});

/* --- bubbles: one speaker at a time, floating over whoever is talking --- */
function placeBubble(el,E,head,O,oHead){
  if(!el||el.hidden||!play||!play.scale)return;
  const vw=play.vw, [sx,sy0]=toScreen(E.x,E.y-head);
  let sy=sy0;
  const bw=el.offsetWidth, bh=el.offsetHeight;
  const left=Math.max(8,Math.min(vw-bw-8,sx-bw/2));
  const [ox,oy]=toScreen(O.x,O.y-oHead);
  if(ox>left-20&&ox<left+bw+20)sy=Math.min(sy,oy);
  el.style.left=left+'px';
  el.style.top=Math.max(6,sy-bh-12)+'px';
  el.style.setProperty('--tail',Math.max(18,Math.min(bw-18,sx-left))+'px');
}
function placeBubbles(){if(!play||!play.B)return;const nh=play.l._npc.head||46;placeBubble($('#bb'),play.B,74,play.N,nh);placeBubble($('#nb'),play.N,nh,play.B,74);const wu=$('#wui');if(wu&&wu.querySelector('.place:not(.dim)'))avoidLabels();}

    ?`<button class="chunk tap" data-k="${key}-c${j}" data-g="${esc(c[nat()])}">${esc(c[tgt()])}</button>`

/* --- level --- */
function startLevel(id,hardMode=false){

  const hard=hardMode||l.boss||l.diff==='hard';
  const lessonWords=l.lesson.map(it=>norm(it[tgt()])).filter(w=>w.length>2);
  const opts=l.nodes.map(n=>n.t==='act'?nodeOpts(n):shuffle(nodeOpts(n)));
  play={id,l,hard,hardMode,noHints:hardMode||l.boss,lessonWords,hints:0,idx:0,hearts:MAX_LIVES,first:0,wrong:false,busy:true,enter:null,reveals:new Set(),elapsed:0,opts,par:parTime(l),camX:l.nodes[0].b[0],z:1,
    tried:new Set(),
    revealable:l.nodes.reduce((a,n,i)=>a+parseLine(n.line).length+(n.t==='say'?opts[i].length:0),0)+parseLine(l.outro).length};
  const n=l.nodes.length;
  const dots=Array.from({length:n},(_,i)=>`<span class="dot" data-d="${i}" style="--p:${i/n}"></span>`).join('');
  const npcG=`<g class="ent npc${l._npc.fly?' fly':''}" id="npc"><ellipse class="cshadow" cx="0" cy="1" rx="${l._npc.sh||20}" ry="4" fill="#1E3B24" opacity="${l._npc.fly?0:.17}"/><g class="react"><g class="flip"><g class="bob">${NPC_ART[l._npc.art]}</g></g></g><text class="fxt" y="-54" text-anchor="middle"></text></g>`;
  const bunG=`<g class="ent bunny" id="bunny"><ellipse class="cshadow" cx="-3" cy="1" rx="24" ry="4.5" fill="#1E3B24" opacity=".17"/><g class="react"><g class="flip"><g class="bob">${bunnyBody}</g></g></g><text class="fxt" y="-80" text-anchor="middle"></text></g>`;
  const art=buildScene(l,npcG,bunG);
  show(`<div class="wrap play-wrap">
    <div class="hud"><button class="quit" id="quit" aria-label="${t('quit')}">✕</button>
      <span class="lvl">${l.world}-${l.num}</span><span class="chip ${l.boss?'hard':l.diff}">${l.boss?t('boss'):t(l.diff)}</span>${hardMode?`<span class="chip hard">${t('hardMode')}</span>`:''}<span class="spacer"></span><button class="quit snd" id="snd" aria-label="${t('sound')}">${save.sound?'♪':'<s>♪</s>'}</button>
      <span class="hearts" id="hearts" aria-label="${t('lives')}"></span>${hard?'':`<span class="trcount" id="trc"></span>`}<span class="clock" id="clock">0:00</span></div>
    <div class="track"><div class="path"></div>${dots}${carrotSvg('mini-carrot')}</div>
    <div class="stage" id="stage">
      <div class="world" id="world"><svg viewBox="0 0 ${l.scene.w} 300" aria-hidden="true">${art}</svg><div class="wui" id="wui"></div></div>
      <div class="iris" id="iris" hidden></div>
      <div class="talk" id="talk"><div class="bub bub-b" id="bb" hidden></div><div class="bub bub-n" id="nb" hidden></div></div>
    </div>
    <div class="panel controls" id="controls"></div>
  </div>`);
  $('#quit').onclick=()=>{play=null;renderMap();};
  $('#snd').onclick=()=>{save.sound=!save.sound;persist();$('#snd').innerHTML=save.sound?'♪':'<s>♪</s>';};
  keyHandler=e=>{if(e.key==='Enter'&&play&&play.enter){e.preventDefault();play.enter();}};
  cleanDecor($('#world svg'));
  play.B=makeEnt($('#bunny'));play.N=makeEnt($('#npc'));play.N.base=l._npc.faces||0;

  timer=setInterval(()=>{const now=Date.now();if(!play.busy)play.elapsed+=(now-last)/1000;last=now;const c=$('#clock');if(c)c.textContent=fmt(play.elapsed);},200);

function hud(lostOne){
  const h=$('#hearts');
  h.innerHTML=Array.from({length:MAX_LIVES},(_,i)=>i<play.hearts?'♥':`<span class="gone ${lostOne&&i===play.hearts?'lost':''}">♥</span>`).join('');
  const trc=$('#trc');if(trc)trc.textContent=`${play.reveals.size+play.hints} ${t('tr')}`;

function frameCam(n,opts){
  // an act frames the bunny and every choice; the speaker is included only when it all still fits
  if(n.t!=='act')return (Math.min(n.b[0],n.n[0])+Math.max(n.b[0],n.n[0]))/2;
  const vis=play.vw/play.scale, core=[n.b[0]-10,...opts.map(o=>o.at[0])], all=[...core,n.n[0]];
  const xs=Math.max(...all)-Math.min(...all)+76<=vis?all:core;

async function setupNode(){

  $('#wui').innerHTML='';
  $('#controls').innerHTML=`<p class="ask muted">…</p>`;
  const cam=frameCam(n,opts);
  if(n.from){
    // arriving somewhere new: start zoomed in where the bunny comes out, open the iris, then pull back
    bunnyQuiet();npcQuiet();
    place(p.B,...n.from);p.B.el.style.opacity='1';
    const zx=p.reg?Math.max(p.reg[0]+p.vw/p.scale/4.4,n.from[0]):n.from[0];
    camTo(zx,0,2.2,n.from[1]-30);
    await iris(true,n.from[0],n.from[1]-30,600);
  }
  p.B.el.style.opacity='1';
  const bRoute=[...(n.via||[]),n.b];

  const crossing=Math.sign(p.B.x-p.N.x)!==Math.sign(n.b[0]-n.n[0]);

  p.B.zy=n.b[1];p.N.zy=n.n[1];depth();
  if(tB>30||tN>30){bunnyQuiet();npcQuiet();}

  const dir=Math.sign(n.b[0]-p.B.x)||Math.sign(n.n[0]-p.N.x);
  const npcAhead=dir*(p.N.x-p.B.x)>0;
  const tBw=routeTime(p.B,bRoute,BUNNY_SPEED);
  const delayB=!crossing&&npcAhead&&tN>tBw?tN-tBw:0, delayN=!crossing&&!npcAhead&&tBw>tN?tBw-tN:0;
  (async()=>{if(delayN)await wait(delayN);walk(p.N,nRoute,p.l._npc.speed);})();
  if(crossing)await wait(400);
  if(delayB)await wait(delayB);
  await walk(p.B,bRoute,BUNNY_SPEED);
  const doneN=Math.max(tN+delayN,0)-(tBw+delayB+(crossing?400:0));
  if(doneN>0)await wait(doneN);

  if(n.show)n.show.split(' ').forEach(id=>{const g=document.getElementById(id);if(g)g.classList.add('shown');});

  renderControls();
}

// keep every label on screen and stop neighbours from touching
function fitLabels(){
  const st=$('#stage').getBoundingClientRect(), z=play.z||1, bs=[...$('#wui').querySelectorAll('.place')];
  bs.forEach(b=>{b.style.removeProperty('--nx');b.style.removeProperty('--lift');});
  bs.forEach(b=>{const r=b.getBoundingClientRect();let dx=0;if(r.left<st.left+4)dx=st.left+4-r.left;else if(r.right>st.right-4)dx=st.right-4-r.right;if(dx)b.style.setProperty('--nx',(dx/z)+'px');});
  const placed=[];
  bs.sort((a,b)=>a.getBoundingClientRect().left-b.getBoundingClientRect().left).forEach(b=>{
    let lift=0;
    for(let k=0;k<4;k++){
      const r=b.getBoundingClientRect(), hit=placed.find(q=>r.left<q.right+3&&q.left<r.right+3&&r.top<q.bottom+3&&q.top<r.bottom+3);
      if(!hit)break;
      lift+=(r.bottom-hit.top+4)/z;b.style.setProperty('--lift',lift+'px');
    }
    placed.push(b.getBoundingClientRect());
  });
}
// the speech bubble slides sideways if it would hide a choice; if no spot is free, it lets taps through to the labels
function avoidLabels(){
  const nb=$('#nb');if(!nb||nb.hidden)return;
  nb.classList.remove('thin');
  const st=$('#stage').getBoundingClientRect(), ls=[...$('#wui').querySelectorAll('.place')].map(b=>b.getBoundingClientRect());
  const hits=()=>{const r=nb.getBoundingClientRect();return ls.some(q=>r.left<q.right+2&&q.left<r.right+2&&r.top<q.bottom+2&&q.top<r.bottom+2);};
  if(!hits())return;
  const left0=parseFloat(nb.style.left)||0, w=nb.offsetWidth, sx=left0+parseFloat(getComputedStyle(nb).getPropertyValue('--tail')||30);
  for(const L of [8,st.width-w-8]){nb.style.left=L+'px';nb.style.setProperty('--tail',Math.max(18,Math.min(w-18,sx-L))+'px');if(!hits())return;}
  nb.style.left=left0+'px';nb.style.setProperty('--tail',Math.max(18,Math.min(w-18,sx-left0))+'px');
  nb.classList.add('thin');
}

function tapCounts(text){const n=' '+norm(text)+' ';return play.lessonWords.some(w=>n.includes(' '+w+' ')||(w.includes(' ')&&n.includes(w)));}
function hintBtn(){return play.noHints?'':`<button class="btn small hintb" id="hint" type="button">${t('hintBtn')}</button>`;}
function wireHint(){
  const b=$('#hint');if(!b)return;
  const p=play, n=p.l.nodes[p.idx];
  b.onclick=()=>{
    if(p.busy)return;
    p.hints++;hud();sfx('click');
    if(n.t==='say'){
      // remove one wrong line
      const opts=p.opts[p.idx], i=opts.findIndex((o,j)=>!o.ok&&!p.tried.has(j));
      if(i>=0){p.tried.add(i);const c=$(`#controls .choice[data-i="${i}"]`);if(c){c.disabled=true;c.classList.add('struck');}}
      if(opts.filter((o,j)=>!o.ok&&!p.tried.has(j)).length===0)b.disabled=true;
    }else{
      // first time: the first letter of every word; second time: the whole first word too
      const ans=n.say[tgt()].replace(/[¿?¡!.,]/g,'').split(' ');

      const th=$('#th');th.hidden=false;

  const houses=Array.from({length:7},(_,i)=>{const x=20+i*56,h=22+(i*13)%14,c=['#F3E3C3','#E8D2B0','#F2D49B'][i%3];return `<rect x="${x}" y="${78-h}" width="40" height="${h}" fill="${c}" stroke="#25311F" stroke-width="1.4"/><path d="M${x-4} ${78-h}L${x+20} ${62-h}L${x+44} ${78-h}Z" fill="#B0402E" stroke="#25311F" stroke-width="1.4"/><rect x="${x+15}" y="${66}" width="10" height="12" fill="#6E4630"/>`;}).join('');
  const towers=Array.from({length:9},(_,i)=>{const x=8+i*44,h=30+(i*17)%34;return `<rect x="${x}" y="${78-h}" width="34" height="${h}" fill="${['#9DC3E6','#C9D6E3','#E8B98A'][i%3]}" stroke="#25311F" stroke-width="1.4"/>${Array.from({length:Math.floor(h/12)},(_,r)=>`<rect x="${x+6}" y="${78-h+5+r*12}" width="6" height="6" fill="#FDFEF8"/><rect x="${x+21}" y="${78-h+5+r*12}" width="6" height="6" fill="#FDFEF8"/>`).join('')}`;}).join('');
  const parts={1:`${G.fence(30,150,78)}${G.tree(330,80,.55)}`,2:houses,3:`${G.pine(60,80,.6)}${G.pine(110,80,.75)}${G.pine(330,80,.7)}${G.pine(250,82,.5)}`,4:towers};
  const sk={1:['#B9E0F2','#EAF6E6','#A9D27F','#86B95C'],2:['#FCE0C0','#FBF2DF','#D9CDB4','#C9BB9C'],3:['#BCD8CB','#E1EEDC','#93C273','#74A957'],4:['#BFDDF0','#EEF1EC','#B9C3A6','#9FAE8A']}[W.id];
  ZN=[];
  return `<svg class="wbanner" viewBox="0 0 400 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${G.sky(k,...sk)}<rect width="400" height="90" fill="url(#sk${k})"/>${G.sun(360,24).replace(/r="34"/,'r="16"').replace(/r="24"/,'r="11"')}<rect y="72" width="400" height="18" fill="url(#gd${k})"/>${parts[W.id]||''}</svg>`;
}
function trailSvg(W){
  // a winding trail through the world's levels
  const n=W.levels.length, pts=W.levels.map((l,i)=>[40+i*(320/(n-1)),i%2?78:34]);
  let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<n;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];d+=` C${x0+20} ${y0} ${x1-20} ${y1} ${x1} ${y1}`;}
  return {pts,svg:`<svg class="trailsvg" viewBox="0 0 400 112" aria-hidden="true"><path d="${d}" fill="none" stroke="#C3A874" stroke-width="12" stroke-linecap="round"/><path d="${d}" fill="none" stroke="#E3D2A8" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 12"/></svg>`};
}

    <p class="eyebrow maptitle">${t('mapTitle')}</p>
    ${worlds}
    ${confirming?`<div class="confirm"><b>${t('resetQ')}</b><div class="row"><button class="btn small primary" id="yes">${t('erase')}</button><button class="btn small" id="no">${t('cancel')}</button></div></div>`:''}
    <div class="row"><span class="save-note">${t('saveNote')}</span><span class="spacer"></span><button class="link" id="reset">${t('reset')}</button></div>

  app.querySelectorAll('.lnode[data-id]').forEach(b=>b.onclick=()=>{sfx('click');openLevel(b.dataset.id);});

  $('#snd').onclick=()=>{save.sound=!save.sound;persist();renderMap();};

/* ============ LESSON and REVIEW (one quiz engine) ============ */
let quiz=null;
function reviewExtras(l,n=3){
  // words from earlier levels that are due come back inside this lesson
  const own=new Set(l.lesson.map(wkey));
  return dueWords().filter(r=>r.lv!==l.id&&!own.has(norm(r[tgt()]))).slice(0,n).map(r=>({it:{es:r.es,en:r.en,alt:r.alt},lv:r.lv,review:true}));
}
function renderStudy(id){
  const l=levelById(id), extra=reviewExtras(l);
  show(`<div class="wrap"><div class="panel">
    <div><div class="eyebrow">${t('lesson')} · ${l.world}-${l.num}</div><h2>${esc(l.title[tgt()])}</h2></div>
    <p class="muted">${t('study')}</p>
    <div class="vocab">${l.lesson.map(w=>`<div class="word"><div><b>${esc(w[tgt()])}</b><span>${esc(w[nat()])}</span></div>${speakBtn(w[tgt()])}</div>`).join('')}
    ${extra.map(x=>`<div class="word rv"><div><em>${t('reviewWord')}</em><b>${esc(x.it[tgt()])}</b><span>${esc(x.it[nat()])}</span></div>${speakBtn(x.it[tgt()])}</div>`).join('')}</div>
    <div class="row"><button class="btn primary" id="ready">${t('ready')}</button><span class="spacer"></span><button class="link" id="back">${t('back')}</button></div>
  </div></div>`);
  $('#ready').onclick=()=>{
    const items=[...l.lesson.map(it=>({it,lv:l.id})),...extra];
    runQuiz({items,label:`${t('lesson')} · ${l.world}-${l.num}`,sub:`${t('afterLesson')} ${t('level')} ${l.num}: ${l.title[tgt()]}`,done:()=>renderReady(id)});
  };
  $('#back').onclick=()=>renderMap();
}
function startReview(){
  let rec=dueWords().slice(0,12);
  if(rec.length<4)rec=[...rec,...weakWords().filter(r=>!rec.includes(r))].slice(0,8);
  const items=rec.map(r=>({it:{es:r.es,en:r.en,alt:r.alt},lv:r.lv,review:true}));
  if(!items.length)return renderMap();
  show(`<div class="wrap"><div class="panel center">
    <div class="hero-art" style="width:110px">${bunnySvg()}</div><h2>${t('reviewTitle')}</h2><p class="muted" style="max-width:46ch">${t('reviewIntro')}</p>
    <button class="btn primary" id="go">${t('reviewGo')} (${items.length})</button><button class="link" id="back">${t('back')}</button></div></div>`);
  $('#go').onclick=()=>runQuiz({items,label:t('reviewTitle'),sub:'',done:()=>{streakTouch();sfx('win');
    show(`<div class="wrap"><div class="panel center"><div class="hero-art" style="width:110px">${bunnySvg()}${carrotSvg()}</div><h2>${t('reviewDone')}</h2>
      <p><span class="streakn big">${streakNow()}</span> ${t('streakDays')}</p><p class="muted">${items.length} ${t('reviewKept')}</p><button class="btn primary" id="m">${t('map')}</button></div></div>`);
    $('#m').onclick=()=>renderMap();}});
  $('#back').onclick=()=>renderMap();
}
function runQuiz(cfg){
  const its=cfg.items, kinds=['mc','type'];
  if(canSpeak)kinds.push('listen');
  const queue=shuffle(its).map((x,i)=>({...x,kind:kinds[i%kinds.length]}));
  if(its.length>=4)queue.unshift({kind:'match',set:shuffle(its).slice(0,4)});
  quiz={cfg,queue,cleared:0,pool:its.map(x=>x.it)};
  renderQuiz();
}
function distractors(it,n=3){
  const pool=[...quiz.pool,...Object.values(me().words).map(r=>({es:r.es,en:r.en}))].filter(o=>norm(o[tgt()])!==norm(it[tgt()])&&norm(o[nat()])!==norm(it[nat()]));
  const uniq=[];pool.forEach(o=>{if(!uniq.some(u=>norm(u[nat()])===norm(o[nat()])))uniq.push(o);});
  return shuffle(uniq).slice(0,n);
}
function renderQuiz(){
  if(!quiz.queue.length)return quiz.cfg.done();
  const q=quiz.queue[0], total=quiz.cleared+quiz.queue.length, pct=Math.round(100*quiz.cleared/total);
  let body='';
  if(q.kind==='match'){
    const L=shuffle(q.set), Rr=shuffle(q.set);
    body=`<p class="ask">${t('matchIt')}</p><div class="match"><div>${L.map((x,i)=>`<button class="choice mL" data-k="${i}">${esc(x.it[tgt()])}</button>`).join('')}</div><div>${Rr.map((x,i)=>`<button class="choice mR" data-k="${i}">${esc(x.it[nat()])}</button>`).join('')}</div></div>`;
    q.L=L;q.R=Rr;
  }else if(q.kind==='mc'||q.kind==='listen'){
    if(!q.opts)q.opts=shuffle([q.it,...distractors(q.it)]);
    body=q.kind==='mc'?`<p class="ask">${t('whatMeans')}</p><div class="q-prompt">${esc(q.it[tgt()])}${speakBtn(q.it[tgt()])}</div>`
      :`<p class="ask">${t('listenPick')}</p><div class="q-prompt"><button class="speak big" data-speak="${esc(q.it[tgt()])}" aria-label="${t('listen')}">${speakerIcon}</button><button class="speak slowb" data-slow="${esc(q.it[tgt()])}" aria-label="${t('slow')}">${slowIcon}</button></div>`;
    body+=`<div class="choices">${q.opts.map((o,i)=>`<button class="choice" data-i="${i}"><span class="num">${i+1}</span><span>${esc(o[nat()])}</span></button>`).join('')}</div>`;
  }else{
    body=`<p class="ask">${t('typeIt')}</p><div class="q-prompt">${esc(q.it[nat()])}</div>
      <div class="typebox"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${t('typeIt')}"><button class="btn leaf" id="chk">${t('check')}</button></div>${accentKeys()}`;
  }
  show(`<div class="wrap"><div class="panel">
    <div class="row"><span class="eyebrow">${esc(quiz.cfg.label)}</span>${q.review?`<span class="chip rvchip">${t('reviewWord')}</span>`:''}<span class="spacer"></span><span class="muted" style="font-size:14px">${quiz.queue.length} ${t('left')}</span><button class="link" id="qback">${t('back')}</button></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    ${quiz.cfg.sub?`<p class="muted" style="font-size:14px">${esc(quiz.cfg.sub)}</p>`:''}
    <div id="qbody">${body}</div></div></div>`);
  $('#qback').onclick=()=>renderMap();
  if(q.kind==='listen')later(()=>speak(q.it[tgt()]),300);
  let phase='ask';
  const finish=(ok,note,mine)=>{
    quiz.queue.shift();
    wordResult(q.it,q.lv,ok);
    if(ok){quiz.cleared++;sfx('ok');}else{sfx('bad');quiz.queue.push({...q,kind:q.kind==='type'?'mc':'type',opts:null});}
    const head=yoursHtml(q.kind==='type'?t('yourResponse'):t('yourChoice'),mine);
    if(ok&&!note){phase='done';$('#qbody').innerHTML=head+`<div class="fb good"><b>${t('correct')}</b>${q.kind==='listen'?`<span class="ans"><b>${esc(q.it[tgt()])}</b> = ${esc(q.it[nat()])}</span>`:''}</div>`;later(renderQuiz,q.kind==='listen'?1400:900);return;}
    phase='fb';
    $('#qbody').innerHTML=head+(ok?`<div class="fb good"><b>${t('correct')}</b><span class="ans">${note}</span>`
      :`<div class="fb bad"><b>${t('notQuite')}</b><span class="ans"><b>${esc(q.it[tgt()])}</b> = <b>${esc(q.it[nat()])}</b></span><span>${t('comesBack')}</span>`)
      +`<div class="row"><button class="btn small" id="c">${t('cont')}</button><span class="keyhint"><kbd>Enter</kbd> ${t('pressEnterGo')}</span></div></div>`;
    $('#c').onclick=renderQuiz;
  };
  if(q.kind==='match'){
    let sel=null, left=4;
    const pairOk=(a,b)=>q.L[+a.dataset.k]===q.R[+b.dataset.k];
    const tap=b=>{
      if(b.disabled)return;
      const side=b.classList.contains('mL')?'L':'R';
      if(!sel||sel.side===side){app.querySelectorAll('.match .sel').forEach(x=>x.classList.remove('sel'));sel={b,side};b.classList.add('sel');sfx('click');return;}
      const [a,c]=side==='R'?[sel.b,b]:[b,sel.b];sel.b.classList.remove('sel');sel=null;
      if(pairOk(a,c)){[a,c].forEach(x=>{x.disabled=true;x.classList.add('right');});sfx('ok');if(--left===0){quiz.queue.shift();quiz.cleared++;later(renderQuiz,500);}}
      else{[a,c].forEach(x=>{x.classList.add('wrongpick');setTimeout(()=>x.classList.remove('wrongpick'),500);});sfx('bad');}
    };
    app.querySelectorAll('.match .choice').forEach(b=>b.onclick=()=>tap(b));
  }else if(q.kind==='mc'||q.kind==='listen'){
    const choose=i=>{if(phase!=='ask')return;finish(q.opts[i]===q.it,'',q.opts[i][nat()]);};
    app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
    keyHandler=e=>{
      if(phase==='ask'&&/^[1-4]$/.test(e.key)&&+e.key<=q.opts.length){e.preventDefault();choose(+e.key-1);}
      else if(phase==='fb'&&e.key==='Enter'){e.preventDefault();renderQuiz();}
    };
  }else{
    const inp=$('#ti');inp.focus();wireAccents(inp);
    const check=()=>{
      if(phase!=='ask')return;
      const v=inp.value.trim();if(!v){inp.focus();return;}
      const g=grade(v,[q.it[tgt()],...((q.it.alt&&q.it.alt[tgt()])||[])]);
      finish(g.ok,g.ok?gradeNote(g):'',v);
    };
    $('#chk').onclick=check;
    keyHandler=e=>{if(e.key!=='Enter')return;e.preventDefault();if(phase==='ask')check();else if(phase==='fb')renderQuiz();};
  }
}
function accentKeys(){
  if(tgt()!=='es')return '';
  return `<div class="accents">${['á','é','í','ó','ú','ñ','¿','¡'].map(c=>`<button type="button" data-ch="${c}">${c}</button>`).join('')}</div>`;
}
function wireAccents(inp){
  app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{
    if(inp.disabled)return;
    const s=inp.selectionStart??inp.value.length,e=inp.selectionEnd??inp.value.length;
    inp.setRangeText(b.dataset.ch,s,e,'end');inp.focus();
  });
}

/* ============ RESULTS ============ */
const catStars=x=>x>=.85?3:x>=.6?2:1;
function renderResults(){
  const p=play, l=p.l, n=l.nodes.length;
  const acc=p.first/n, used=p.reveals.size+p.hints;
  const trScore=p.hard?null:clamp(1-used/Math.max(4,p.revealable*0.35));
  const timeScore=p.elapsed<=p.par?1:clamp(1-(p.elapsed-p.par)/(2*p.par));
  const score=p.hard?(0.8*acc+0.2*timeScore):(0.6*acc+0.25*trScore+0.15*timeScore);
  const st=score>=.85?3:score>=.6?2:1;
  me().stars[l.id]=Math.max(starsOf(l.id),st);
  if(p.hardMode)me().hard[l.id]=true;
  // the level's words have now been used in a real conversation
  l.lesson.forEach(it=>wordRec(it,l.id));
  persist();sfx('win');
  const idx=levelIndex(l.id), nextL=LEVELS[idx+1], worldEnd=l.boss;
  show(`<div class="wrap"><div class="panel center">
    <div class="eyebrow">${l.world}-${l.num} · ${esc(l.title[tgt()])}${p.hardMode?' · '+t('hardMode'):''}</div>
    <h2>${t('reached')}</h2>
    ${stars(st,'big-stars')}
    <div class="breakdown" style="width:100%;text-align:left">
      <div class="brow"><div><b>${t('accuracy')}</b><small>${p.first}/${n} ${t('firstTry')}</small></div><span class="val">${Math.round(acc*100)}%</span>${stars(catStars(acc))}</div>
      <div class="brow"><div><b>${t('translations')}</b><small>${p.hard?t('noTr'):`${p.reveals.size} ${t('used')} · ${p.hints} ${t('hintUsed')}`}</small></div><span class="val">${p.hard?'—':used}</span>${p.hard?'<span></span>':stars(catStars(trScore))}</div>
      <div class="brow"><div><b>${t('time')}</b><small>${t('target')} ${fmt(p.par)}</small></div><span class="val">${fmt(p.elapsed)}</span>${stars(catStars(timeScore))}</div>
    </div>
    <div class="cando"><b>${t('canNow')}:</b> ${esc(l.can[nat()])}</div>
    <div class="tip"><b>${t('tipTitle')}</b><p>${l.note[nat()]}</p></div>
    <details class="lw"><summary>${t('wordsLearned')} (${l.lesson.length})</summary><div class="vocab">${l.lesson.map(w=>`<div class="word"><div><b>${esc(w[tgt()])}</b><span>${esc(w[nat()])}</span></div>${speakBtn(w[tgt()])}</div>`).join('')}</div></details>
    ${!nextL&&worldEnd?`<p class="muted">${t('allDone')}</p>`:''}
    <div class="row" style="justify-content:center">
      ${nextL?`<button class="btn primary" id="next">${t('next')}</button>`:''}
      <button class="btn" id="replay">${t('replay')}</button><button class="btn" id="map">${t('map')}</button></div>
  </div></div>`);
  const goNext=()=>{if(worldEnd){const W=WORLDS[l.world-1];renderStory(W,'outro',()=>nextL?openLevel(nextL.id):renderMap());}else openLevel(nextL.id);};
  if(nextL)$('#next').onclick=goNext;
  $('#replay').onclick=()=>startLevel(l.id,p.hardMode);
  $('#map').onclick=()=>{if(worldEnd&&!me().intro['o'+l.world]){me().intro['o'+l.world]=true;persist();renderStory(WORLDS[l.world-1],'outro',renderMap);}else renderMap();};
}

/* ============ BOOT ============ */
(async()=>{
  show(`<div class="wrap title-screen"><div class="hero-art">${bunnySvg()}</div><p class="muted">…</p></div>`);
  try{await loadContent();}catch(e){show(`<div class="wrap"><div class="panel"><h2>El Conejo</h2><p>The levels could not load (${esc(e.message)}). Reload the page to try again.</p></div></div>`);return;}
  if(save.target==='es'||save.target==='en')renderMap();else renderTitle();
})();

</script>
